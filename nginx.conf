server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API: same-origin proxy to the backend (see CLAUDE.md contract).
    # Assumes a linked "backend" container/service (e.g. via docker-compose
    # or --network); override with a custom nginx.conf if it lives elsewhere.
    # Resolved at request time (not on nginx startup) so this image still
    # starts and serves static assets even if no backend is linked yet.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream "http://backend:8080";

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: let react-router handle /login, /register, /chat, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
