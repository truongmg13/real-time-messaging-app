<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #0f1117;
            color: #e2e8f0;
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }
        header {
            background: #1a1d27;
            border-bottom: 1px solid #2d3148;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        header h1 {
            font-size: 1rem;
            font-weight: 600;
            color: #a5b4fc;
        }
        #status-badge {
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: #2d2d2d;
            color: #94a3b8;
        }
        #status-badge.connected     { background: #14532d; color: #4ade80; }
        #status-badge.authenticated { background: #1e3a5f; color: #60a5fa; }
        #status-badge.closed        { background: #3b1919; color: #f87171; }
        main {
            display: grid;
            grid-template-columns: 320px 1fr;
            overflow: hidden;
        }
        .panel {
            background: #13151f;
            border-right: 1px solid #2d3148;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .section {
            padding: 16px;
            border-bottom: 1px solid #1e2133;
        }
        .section h2 {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-size: 0.78rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        input, textarea {
            width: 100%;
            background: #0f1117;
            border: 1px solid #2d3148;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 0.82rem;
            padding: 8px 10px;
            outline: none;
            transition: border-color 0.15s;
            font-family: inherit;
        }
        input:focus, textarea:focus { border-color: #6366f1;}
        textarea { resize: vertical; min-height: 70px; }
        .field { margin-bottom: 10px; }
        .field.last-child { margin-bottom: 0; }

        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 8px 14px;
            transition: opacity 0.15s, background 0.15s;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-primary { background: #6366f1; color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #818cf8; }
        .btn-success { background: #166534; color: #4ade80; }
        .btn-success:hover:not(:disabled) { background: #15803d; }
        .btn-danger { background: #7f1d1d; color: #f87171; }
        .btn-danger:hover:not(:disabled) { background: #991b1b; }
        .btn-ghost { background: #1e2133; color: #94a3b8; }
        .btn-ghost:hover:not(:disabled) { background: #2d3148; }

        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-row button { flex: 1; }

        .log-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .log-toolbar {
            background: #13151f;
            border-bottom: 1px solid #2d3148;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .log-toolbar span { font-size: 0.75rem; color: #64748b; }

        #log {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-entry {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 10px;
            font-size: 0.78rem;
            align-items: start;
        }
        .log-entry .ts { color: #475569; font-size: 0.7rem; padding-top: 7px; font-family: monospace; }
        .log-entry .bubble {
            padding: 7px 11px;
            border-radius: 8px;
            word-break: break-all;
            line-height: 1.5;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            white-space: pre-wrap;
        }
        .log-entry.sent   .bubble { background: #1e1f40; border-left: 3px solid #6366f1; color: #a5b4fc; }
        .log-entry.recv   .bubble { background: #0f2a1f; border-left: 3px solid #4ade80; color: #86efac; }
        .log-entry.info   .bubble { background: #1c1a10; border-left: 3px solid #fbbf24; color: #fcd34d; }
        .log-entry.error  .bubble { background: #1f0f0f; border-left: 3px solid #f87171; color: #fca5a5; }
        .log-entry.system .bubble { background: #111827; border-left: 3px solid #475569; color: #94a3b8; }

    </style>
</head>

<body>

<header>
    <h1>WebSocket Test: ws://localhost:8081</h1>
    <span id="status-badge">Disconnected</span>
</header>

<main>
    <div class="panel">
        <div class="section">
            <h2>Connection</h2>
            <div class="field">
                <label>Server URL</label>
                <input type="text" id="wsUrl" value="ws://localhost:8081" />
            </div>
            <div class="btn-row">
                <button id="btnConnect" class="btn-primary" onclick="connect()">Connect</button>
                <button id="btnDisconnect" class="btn-danger" onclick="disconnect()" disabled>Disconnect</button>
            </div>
        </div>

        <div class="section">
            <h2>1 &mdash; Authenticate</h2>
            <div class="field">
                <label>REST Base URL</label>
                <input id="restUrl" value="http://localhost:8080" />
            </div>
            <div class="field">
                <label>Username</label>
                <input id="authUsername" placeholder="username" />
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="authPassword" placeholder="password" />
            </div>
            <div class="btn-row">
                <button class="btn-success" onclick="loginAndAuth()">Login + Send AUTH</button>
            </div>
        </div>

        <div class="section">
            <h2>2 &mdash; Send Message</h2>
            <div class="field">
                <label>Recipient User ID (UUID)</label>
                <input type="text" id="recipientId" placeholder="xxxxxxxx-xxxx-xxxx-xxxxxxxxxxxx" />
            </div>
            <div class="field">
                <label>Content</label>
                <textarea id="msgContent" placeholder="Hello!" style="min-height:50px"></textarea>
            </div>
            <div class="btn-row">
                <button id="btnSend" class="btn-primary" onclick="sendMessage()" disabled>Send Message</button>
            </div>
        </div>
        
    </div>

    <div class="log-panel">
        <div class="log-toolbar">
            <span id="logCount">0 events</span>
            <button class="btn-ghost">Clear</button>
        </div>
        <div id="log"></div>
    </div>
</main>

</body>


<script>
    let ws = null;
    let logEntries = 0;
    
    function connect() {
        const url = document.getElementById('wsUrl').value.trim();
        if (ws) { ws.close(); ws = null; }
        addLog('system', `Connecting to ${url} ...`);

        ws = new WebSocket(url);

        ws.onopen = function() {
            console.log("Connection established");
            setStatus('connected', 'Connected');
            addLog('info', 'Handshake complete. You have 30s to send AUTH.');
        }

        ws.onmessage = function(e) {
            try {
                var msg = JSON.parse(e.data);
                addRecvLog(JSON.stringify(msg, null, 2));
                // if (msg.type === 'MESSAGE' && msg.id) {
                //     document.getElementById('readMsgId').value = msg.id;
                // }
                if (msg.type === 'AUTH_OK') {
                    setStatus('authenticated', 'Authed ' + (msg.userId || '').slice(0, 8) + '...');
                    addInfoLog('Authenticated as userId: ' + msg.userId);
                }
            } catch(err) {
                addErrorLog(err);
            }
        }

        ws.onerror = function() {
            console.error("WebSocket error: ");
        }

        ws.onclose = function(e) {
            console.log("Connection closed");
            setStatus('closed', 'Closed');
            addLog('system', 'Closed - code ' + e.code + (e.reason ? ' - ' + e.reason : ''));
            setButtons(false);
            ws = null;
        }
    }

    function disconnect() {
        if (ws) ws.close(1000, 'Client closed');
    }

    function loginAndAuth() {
        if (!ws || ws.readyState !== WebSocket.OPEN) { addErrorLog('Please connect to websocket server.'); return; }

        var base     = document.getElementById('restUrl').value.trim();
        var username = document.getElementById('authUsername').value.trim();
        var password = document.getElementById('authPassword').value.trim();

        if (!username || !password) {
            addLog('error', 'Enter username and password first');
            return;
        }

        addLog('info', 'POST ' + base + '/api/auth/login ...');
        fetch(base + '/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(function(res) {
            return res.json().then(function(data) {
                if (!res.ok) {
                    addLog('error', 'Login failed (' + res.status + '): ' + JSON.stringify(data));
                    return;
                }
                addLog('info', 'Login OK - welcome back ' + data.displayName);
                wsSend( {type: 'AUTH', token: data.token} );
                setButtons(true);
            });
        })
        .catch(function(err) {
            addLog('error', 'Fetch error: ' + err.message);
            setButtons(false);
        });
    }

    function sendMessage() {
        console.log('send message');
        var recipientId = document.getElementById('recipientId').value.trim();
        var content     = document.getElementById('msgContent').value.trim();
        if (!recipientId) { addErrorLog('Enter a recipient UUID'); return; }
        if (!content)     { addErrorLog('Message is empty'); return; }
        wsSend( {type: 'SEND', recipientId: recipientId, content: content} );
    }

    function wsSend(obj) {
        if (!ws || ws.readyState !== WebSocket.OPEN) { addErrorLog('Not connected.'); return; }
        ws.send(JSON.stringify(obj));
        addSentLog(JSON.stringify(obj, null, 2));
    }

    function addErrorLog(message) {
        addLog('error', message);
    }

    function addInfoLog(message) {
        addLog('info', message);
    }

    function addRecvLog(message) {
        addLog('recv', message);
    }

    function addSentLog(message) {
        addLog('sent', message);
    }

    function addLog(type, message) {
        var container = document.getElementById('log');
        var now = new Date();
        var ts = now.toTimeString().slice(0, 8) + '.' + String(now.getMilliseconds()).padStart(3, '0');
        var entry = document.createElement('div');
        var validTypes = ['sent', 'error', 'info'];
        var cls = validTypes.indexOf(type) !== -1 ? type : 'system';
        entry.className = 'log-entry ' + cls;
        entry.innerHTML = '<span class="ts">' + ts + '</span><span class="bubble">' + escHtml(message) + '</span>';
        container.appendChild(entry);
        container.scrollTop = container.scrollHeight;
        logEntries++;
        document.getElementById('logCount').textContent = logEntries + ' event' + (logEntries !== 1 ? 's' : '');
    }

    function setStatus(cls, text) {
        var el = document.getElementById('status-badge');
        el.className = cls;
        el.textContent = text;
    }

    function setButtons(connected) {
        document.getElementById('btnConnect').disabled = connected;
        ['btnDisconnect','btnSend'].forEach(function(id) {
            document.getElementById(id).disabled = !connected;
        })
    }

    function escHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
</script>

</html>
